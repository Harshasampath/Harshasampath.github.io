<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Puppy Dice makes it easy to roll dice for games with friends and family.">
  <title>Puppy Dice — Roll into fun</title>
  <link rel="icon" href="icon.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f8ff;color:#14213d;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em}header img{width:42px;height:42px;border-radius:12px}.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:48px;padding:80px 0}h1{font-size:clamp(46px,7vw,78px);letter-spacing:-.05em;line-height:1.05;margin:12px 0 24px}p{color:#405473;max-width:560px;font-size:18px}.tag{color:#2f6fe0;font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}.art{width:100%;max-width:370px;border-radius:25%;box-shadow:0 25px 70px #5b9bd550}footer{border-top:1px solid #cddff1;padding:26px 0;color:#60718a;font-size:14px}@media(max-width:700px){.hero{display:flex;flex-direction:column-reverse;align-items:start;padding:50px 0}.art{max-width:260px}}
  </style>
</head>
<body><main>
  <header><img src="icon.png" alt=""> Puppy Dice</header>
  <section class="hero">
    <div><span class="tag">Your game night companion</span><h1>Ready, set,<br>roll.</h1><p>Bring the fun wherever you play. Puppy Dice puts dice in your pocket for board games, family time and spontaneous challenges.</p></div>
    <img class="art" src="icon.png" alt="A friendly puppy holding a blue and white die">
  </section>
  <footer>© Puppy Dice</footer>
</main></body>
</html>
